[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avsim"
version = "0.1.0"
description = "Modular 2-D autonomous-driving simulator: vehicle dynamics, perception, planning, MPC and KPI evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "scipy>=1.10", "matplotlib>=3.7"]

[project.scripts]
avsim = "avsim.cli:main"

[tool.setuptools.packages.find]
include = ["avsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
